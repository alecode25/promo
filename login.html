<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Accedi — Club 1 Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="auth-inner">

    <div class="auth-logo">
      <img src="https://www.portagalliana-clubprimopiano.com/assets/logo.png" alt="Club 1 Piano"
           onerror="this.style.display='none';document.getElementById('auth-logo-text').style.display='block'">
      <div id="auth-logo-text" style="display:none">Club 1 Piano</div>
    </div>

    <div class="auth-tagline">
      Food · Drink · Music<br>
      <span>Porta Galliana, Rimini</span>
    </div>

    <!-- TAB TOGGLE -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Accedi</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Registrati</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="form-login" class="auth-form">
      <div class="field-group">
        <label class="field-label">Email</label>
        <input type="email" id="login-email" class="field-input" placeholder="la-tua@email.it" autocomplete="email">
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password" id="login-password" class="field-input" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="login-error" class="auth-error hidden"></div>
      <button class="auth-cta" id="login-btn" onclick="handleLogin()">Entra</button>
      <div class="auth-forgot" onclick="showMsg('Funzione in arrivo')">Password dimenticata?</div>
    </div>

    <!-- REGISTER FORM -->

    <div id="form-register" class="auth-form hidden">
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Nome</label>
          <input type="text" id="reg-name" class="field-input" placeholder="Mario" autocomplete="given-name">
        </div>
        <div class="field-group">
          <label class="field-label">Cognome</label>
          <input type="text" id="reg-surname" class="field-input" placeholder="Rossi" autocomplete="family-name">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Email</label>
        <input type="email" id="reg-email" class="field-input" placeholder="la-tua@email.it" autocomplete="email">
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password" id="reg-password" class="field-input" placeholder="Min. 8 caratteri" autocomplete="new-password">
      </div>
      <div class="field-group">
        <label class="field-label">Numero di telefono (opzionale)</label>
        <input type="tel" id="reg-phone" class="field-input" placeholder="+39 333 1234567" autocomplete="tel">
      </div>
      <div id="reg-error" class="auth-error hidden"></div>
      <button class="auth-cta" id="register-btn" onclick="handleRegister()">Crea account</button>
      <div class="auth-terms">Registrandoti accetti i <u>Termini</u> e la <u>Privacy Policy</u></div>
    </div>

    <!-- GUEST -->
    <div class="auth-divider"><span>oppure</span></div>
    <button class="auth-guest" onclick="enterAsGuest()">Continua senza account</button>

  </div>

<div id="msg-toast"></div>

<script src="login.js"></script>
</body>
</html>

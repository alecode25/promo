<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner — Club 1 Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="scanner.css">
</head>
<body>

<!-- LOGIN -->
<div id="s-login">
  <div class="s-login-box">
    <div class="s-logo">Club 1 Piano</div>
    <div class="s-logo-sub">Scanner cameriere</div>
    <input type="text" id="s-username" class="s-input" placeholder="Username" autocomplete="username" inputmode="email">
    <input type="password" id="s-password" class="s-input" placeholder="Password" autocomplete="current-password">
    <div id="s-login-err" class="s-error hidden"></div>
    <button class="s-btn" id="s-login-btn" onclick="scannerLogin()">Accedi</button>
  </div>
</div>

<!-- SCANNER APP -->
<div id="s-app" class="hidden">

  <!-- topbar -->
  <div class="s-topbar">
    <div class="s-topbar-left">
      <div class="s-topbar-dot"></div>
      <div class="s-topbar-name" id="s-waiter-name">Cameriere</div>
    </div>
    <button class="s-topbar-logout" onclick="scannerLogout()" title="Esci">
      <i class="ti ti-logout"></i>
    </button>
  </div>

  <!-- camera viewport -->
  <div class="s-viewport" id="s-viewport">
    <video id="s-video" autoplay muted playsinline></video>
    <canvas id="s-canvas"></canvas>

    <!-- crosshair frame -->
    <div class="s-frame" id="s-frame">
      <div class="s-corner tl"></div>
      <div class="s-corner tr"></div>
      <div class="s-corner bl"></div>
      <div class="s-corner br"></div>
    </div>

    <div class="s-hint" id="s-hint">Punta la fotocamera sul QR dell'utente</div>
  </div>

  <!-- result card (slides up when QR found) -->
  <div id="s-result-card" class="s-result-card hidden">
    <div class="s-result-handle"></div>

    <div class="s-result-header">
      <div class="s-result-avatar" id="s-result-avatar">??</div>
      <div class="s-result-info">
        <div class="s-result-name" id="s-result-name">—</div>
        <div class="s-result-level" id="s-result-level">—</div>
      </div>
    </div>

    <div class="s-result-stats">
      <div class="s-stat">
        <div class="s-stat-val" id="s-result-pts">0</div>
        <div class="s-stat-lbl">Punti</div>
      </div>
      <div class="s-stat-divider"></div>
      <div class="s-stat">
        <div class="s-stat-val" id="s-result-visits">0</div>
        <div class="s-stat-lbl">Visite</div>
      </div>
    </div>

    <div class="s-amount-row">
      <label class="s-amount-label">Importo speso (€) — opzionale</label>
      <div class="s-amount-wrap">
        <span class="s-amount-euro">€</span>
        <input type="number" id="s-amount" class="s-input s-amount-input" placeholder="0" min="0" step="1">
      </div>
      <div class="s-amount-hint">Inserisci l'importo per aggiungere punti (1€ = 1 pt)</div>
    </div>

    <div class="s-result-actions">
      <button class="s-btn s-btn--ghost" onclick="cancelScan()">
        <i class="ti ti-x"></i> Annulla
      </button>
      <button class="s-btn s-btn--confirm" id="s-confirm-btn" onclick="confirmCheckin()">
        <i class="ti ti-check"></i> Conferma check-in
      </button>
    </div>
  </div>

</div>

<!-- TOAST -->
<div id="s-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="scanner.js"></script>
</body>
</html>
